name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: App tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Kerberos headers (pypsrp[kerberos] builds gssapi)
        run: sudo apt-get update -q && sudo apt-get install -y -q libkrb5-dev
      - run: pip install -r requirements.txt httpx
      - name: Demo data, every alert and every standard report
        env:
          DATABASE_URL: sqlite:///ci.db
        run: |
          python -m netinv demo
          python - <<'PY'
          import logging; logging.disable(logging.CRITICAL)
          from fastapi.testclient import TestClient
          import netinv.main as m
          with TestClient(m.app) as c:
              al = c.get("/api/alerts").json()
              bad = [a["id"] for a in al if a["error"]]
              assert not bad, f"alert rules failed: {bad}"
              for r in c.get("/api/library").json():
                  x = c.get(f"/api/library/{r['id']}")
                  assert x.status_code == 200, (r["id"], x.text[:300])
              for u in ("/", "/api/summary", "/api/users/alee", "/api/settings", "/api/update"):
                  assert c.get(u).status_code == 200, u
              print(len(al), "alerts and the report library OK")
          PY
          python tests/test_catalog.py
          python tests/test_scripts.py
          python tests/test_pctools.py
          python tests/test_groups.py
          python tests/test_user_groups.py
          python tests/test_agentpush.py
          python tests/test_instance.py
          python tests/test_report_drill.py
          python tests/test_remote.py
      - name: JavaScript syntax
        run: node --check netinv/static/app.js
      - name: Agent inventory script matches the WinRM one
        run: python tools/gen_agent.py --check

  windows:
    name: Windows installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Built before the server installer, which ships it so the server can serve and push it.
      - name: Build agent MSI
        continue-on-error: true      # never let the optional agent block the server release
        shell: powershell
        run: |
          $v = (Get-Content VERSION -Raw).Trim() + '.${{ github.run_number }}'
          .\installer\agent\build-agent.ps1 -Version $v
      - name: Build installer
        shell: powershell
        env:
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim() + '.${{ github.run_number }}'
          $notes = ("$env:NOTES" -split "`n")[0]
          .\installer\build.ps1 -Version $v -Notes $notes
      - name: Agent and setup scripts parse
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @(Get-ChildItem netinv\agent\*.ps1) + @(Get-ChildItem installer\scripts\*.ps1)) {
            $err = $null; [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err)
            if ($err) { $bad++; $err | ForEach-Object { Write-Host "::error file=$($f.Name)::$($_.Message) (line $($_.Extent.StartLineNumber))" } }
          }
          if ($bad) { exit 1 }
      - name: Scripts sent to PCs parse
        continue-on-error: true      # reported as errors on the run; checked before each release
        shell: powershell
        run: |
          python -m pip install -q -r requirements.txt
          python tools/dump_ps.py installer\build\psparse
          if ($LASTEXITCODE) { exit 1 }
          $bad = 0
          foreach ($f in Get-ChildItem installer\build\psparse\*.ps1) {
            $err = $null; [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err)
            if ($err) { $bad++; Write-Host (Get-Content $f.FullName -TotalCount 3 | Out-String); $err | ForEach-Object { Write-Host "::error file=$($f.Name)::$($_.Message) (line $($_.Extent.StartLineNumber))" } }
          }
          if ($bad) { exit 1 }
      # Published straight from this job: no Actions artifact, so the account's artifact storage
      # quota (shared with the other apps) can't block a release.
      # Installable builds live in the public, releases-only prod repo (this source repo is private):
      # one Release per build (lan-v<version>) plus "lan-latest", whose latest.json every installed
      # NetInventory server checks for updates.
      - name: Publish to prod
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.PROD_REPO_TOKEN }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          $ErrorActionPreference = 'Continue'   # gh writes notes to stderr; results are checked by exit code
          if (-not $env:GH_TOKEN) { Write-Host "::error::No PROD_REPO_TOKEN secret: can't publish to userxx09-afk/prod."; exit 1 }
          $prod = 'userxx09-afk/prod'
          $out = 'installer\output'
          $m = Get-Content "$out\latest.json" -Raw | ConvertFrom-Json
          $v = $m.version
          # Point the update at the versioned release, which never changes under a download.
          $m.url = "https://github.com/$prod/releases/download/lan-v$v/$($m.file)"
          [IO.File]::WriteAllText("$PWD\$out\latest.json", ($m | ConvertTo-Json), (New-Object Text.UTF8Encoding $false))
          Copy-Item "$out\$($m.file)" "$out\NetInventory-Setup.exe"   # fixed name for downloading by hand
          $files = @("$out\$($m.file)", "$out\NetInventory-Setup.exe", "$out\latest.json")
          if (Test-Path "$out\NetInventory-Agent.msi") { $files += "$out\NetInventory-Agent.msi" } else { Write-Host "::warning::Agent MSI wasn't built; publishing without it." }
          $notes = ("$env:NOTES" -split "`n")[0]; if (-not $notes) { $notes = 'Update' }
          gh release delete "lan-v$v" --repo $prod --yes --cleanup-tag 2>$null
          # Through a file: Windows PowerShell 5.1 doesn't escape double quotes in arguments to native programs, so a
          # commit title with "quotes" split into extra arguments and gh took the words as file names.
          $nf = Join-Path $env:RUNNER_TEMP 'notes.txt'; [IO.File]::WriteAllText($nf, $notes)
          gh release create "lan-v$v" @files --repo $prod --target main --title "NetInventory $v" --notes-file $nf --latest=false
          if ($LASTEXITCODE) { throw "Publishing lan-v$v failed" }
          gh release delete lan-latest --repo $prod --yes --cleanup-tag 2>$null
          gh release create lan-latest @files --repo $prod --target main --title "NetInventory (latest: $v)" --latest=false `
            --notes "Always the newest NetInventory. Installer: https://github.com/$prod/releases/download/lan-latest/NetInventory-Setup.exe"
          if ($LASTEXITCODE) { throw 'Publishing lan-latest failed' }
          Write-Host "Published NetInventory $v to $prod"
