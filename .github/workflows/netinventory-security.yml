name: NetInventory Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 02:15 UTC
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      run_active_dast:
        description: "Run active DAST against TEST environment"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

env:
  NETINVENTORY_TEST_URL: ${{ vars.NETINVENTORY_TEST_URL }}

jobs:

  # ==========================================================================
  # 0. PREFLIGHT
  # Verifies that the test target exists and the self-hosted runner can reach it
  # ==========================================================================
  preflight:
    name: Security test preflight
    runs-on: self-hosted

    steps:
      - name: Validate NetInventory test configuration
        shell: bash
        env:
          BASE_URL: ${{ vars.NETINVENTORY_TEST_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "::error::NETINVENTORY_TEST_URL is not configured"
            exit 1
          fi

          echo "NetInventory security test target is configured."

      - name: Verify NetInventory is reachable
        shell: bash
        env:
          BASE_URL: ${{ vars.NETINVENTORY_TEST_URL }}
        run: |
          echo "Testing connectivity to NetInventory..."

          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 20 \
            "$BASE_URL" > /dev/null

          echo "NetInventory is reachable."


  # ==========================================================================
  # 1. SECRET SCANNING
  # ==========================================================================
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================================
  # 2. STATIC APPLICATION SECURITY TESTING
  # ==========================================================================
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/owasp-top-ten
            p/security-audit


  # ==========================================================================
  # 3. DEPENDENCY / FILESYSTEM VULNERABILITY SCANNING
  # ==========================================================================
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif


  # ==========================================================================
  # 4. SOFTWARE BILL OF MATERIALS
  # ==========================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: netinventory-sbom.cdx.json

      - name: Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: netinventory-sbom
          path: netinventory-sbom.cdx.json
          retention-days: 90


  # ==========================================================================
  # 5. NETINVENTORY APPLICATION SECURITY TESTS
  # Requires successful preflight
  # ==========================================================================
  app-security:
    name: NetInventory security tests
    runs-on: self-hosted
    needs: preflight

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run HTTP/header/cookie tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
        run: |
          pytest tests/security/test_headers.py -v
          pytest tests/security/test_sessions.py -v

      - name: Run authorization matrix
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          VIEWER_USER: ${{ secrets.NETINV_VIEWER_USER }}
          VIEWER_PASSWORD: ${{ secrets.NETINV_VIEWER_PASSWORD }}
          OPERATOR_USER: ${{ secrets.NETINV_OPERATOR_USER }}
          OPERATOR_PASSWORD: ${{ secrets.NETINV_OPERATOR_PASSWORD }}
          ADMIN_USER: ${{ secrets.NETINV_TEST_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.NETINV_TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/security/test_authorization.py -v

      - name: Run CSRF tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          TEST_USER: ${{ secrets.NETINV_TEST_ADMIN_USER }}
          TEST_PASSWORD: ${{ secrets.NETINV_TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/security/test_csrf.py -v

      - name: Run logout/session-expiration tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          TEST_USER: ${{ secrets.NETINV_VIEWER_USER }}
          TEST_PASSWORD: ${{ secrets.NETINV_VIEWER
