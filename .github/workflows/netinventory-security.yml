name: NetInventory Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly at 02:15 UTC
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      run_active_dast:
        description: "Run active DAST against TEST environment"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

env:
  # Configure this as a GitHub repository/environment variable.
  # It MUST point only to the disposable TEST/STAGING instance.
  NETINVENTORY_TEST_URL: ${{ vars.NETINVENTORY_TEST_URL }}

jobs:

  # --------------------------------------------------------------------------
  # 1. Secret scanning
  # --------------------------------------------------------------------------
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 2. Static application security testing
  # --------------------------------------------------------------------------
  sast:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/owasp-top-ten
            p/security-audit

  # --------------------------------------------------------------------------
  # 3. Dependency / filesystem vulnerabilities
  # --------------------------------------------------------------------------
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  # --------------------------------------------------------------------------
  # 4. SBOM
  # --------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: netinventory-sbom.cdx.json

      - name: Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: netinventory-sbom
          path: netinventory-sbom.cdx.json
          retention-days: 90

  # --------------------------------------------------------------------------
  # 5. NetInventory application security tests
  #
  # Implement tests/security/* using pytest, Newman, or your existing test
  # framework. These tests should exercise a TEST instance only.
  # --------------------------------------------------------------------------
  app-security:
    name: NetInventory security tests
    runs-on: self-hosted
    if: ${{ vars.NETINVENTORY_TEST_URL != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run HTTP/header/cookie tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
        run: |
          pytest tests/security/test_headers.py -v
          pytest tests/security/test_sessions.py -v

      - name: Run authorization matrix
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          VIEWER_USER: ${{ secrets.NETINV_VIEWER_USER }}
          VIEWER_PASSWORD: ${{ secrets.NETINV_VIEWER_PASSWORD }}
          OPERATOR_USER: ${{ secrets.NETINV_OPERATOR_USER }}
          OPERATOR_PASSWORD: ${{ secrets.NETINV_OPERATOR_PASSWORD }}
          ADMIN_USER: ${{ secrets.NETINV_TEST_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.NETINV_TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/security/test_authorization.py -v

      - name: Run CSRF tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          TEST_USER: ${{ secrets.NETINV_TEST_ADMIN_USER }}
          TEST_PASSWORD: ${{ secrets.NETINV_TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/security/test_csrf.py -v

      - name: Run logout/session-expiration tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          TEST_USER: ${{ secrets.NETINV_VIEWER_USER }}
          TEST_PASSWORD: ${{ secrets.NETINV_VIEWER_PASSWORD }}
        run: |
          pytest tests/security/test_logout.py -v

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netinventory-app-security-results
          path: |
            test-results/
          if-no-files-found: ignore
          retention-days: 90

  # --------------------------------------------------------------------------
  # 6. OWASP ZAP passive baseline
  # --------------------------------------------------------------------------
  zap-baseline:
    name: ZAP baseline
    runs-on: self-hosted
    if: ${{ vars.NETINVENTORY_TEST_URL != '' }}

    steps:
      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.NETINVENTORY_TEST_URL }}
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report

  # --------------------------------------------------------------------------
  # 7. Destructive / state-changing security tests
  #
  # NIGHTLY or manually requested only.
  # These MUST target a resettable staging instance and disposable endpoints.
  # --------------------------------------------------------------------------
  active-security:
    name: Controlled active security tests
    runs-on: self-hosted
    needs:
      - secrets
      - sast
      - dependencies
      - app-security
      - zap-baseline

    if: >-
      ${{
        vars.NETINVENTORY_TEST_URL != '' &&
        (
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.run_active_dast == true)
        )
      }}

    environment: netinventory-security-test

    steps:
      - uses: actions/checkout@v4

      - name: Verify target guardrail
        shell: bash
        run: |
          case "${NETINVENTORY_TEST_URL}" in
            *netinventory-test*|*netinventory-staging*|https://10.*|https://172.16.*|https://192.168.*)
              echo "Approved non-production target"
              ;;
            *)
              echo "Refusing active testing against unapproved target."
              exit 1
              ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security test requirements
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Injection and XSS tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          TEST_USER: ${{ secrets.NETINV_TEST_ADMIN_USER }}
          TEST_PASSWORD: ${{ secrets.NETINV_TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/security/test_injection.py -v
          pytest tests/security/test_xss.py -v

      - name: Package/upload abuse tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          TEST_USER: ${{ secrets.NETINV_TEST_ADMIN_USER }}
          TEST_PASSWORD: ${{ secrets.NETINV_TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/security/test_uploads.py -v

      - name: High-risk API negative tests
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          VIEWER_USER: ${{ secrets.NETINV_VIEWER_USER }}
          VIEWER_PASSWORD: ${{ secrets.NETINV_VIEWER_PASSWORD }}
        run: |
          pytest tests/security/test_privileged_operations.py -v

      - name: Audit validation
        env:
          BASE_URL: ${{ env.NETINVENTORY_TEST_URL }}
          ADMIN_USER: ${{ secrets.NETINV_TEST_ADMIN_USER }}
          ADMIN_PASSWORD: ${{ secrets.NETINV_TEST_ADMIN_PASSWORD }}
        run: |
          pytest tests/security/test_audit.py -v

      - name: Archive active-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: active-security-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 90
