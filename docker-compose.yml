services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: netinv
      POSTGRES_USER: netinv
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change-me}
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # expose to localhost only; open up if Power BI connects remotely

  app:
    build: .
    restart: unless-stopped
    depends_on: [db]
    ports: ["8080:8080"]
    env_file: .env                   # AD_PASSWORD, WINRM_PASSWORD, SNMP_COMMUNITY, PG_PASSWORD...
    environment:
      DATABASE_URL: postgresql+psycopg://netinv:${PG_PASSWORD:-change-me}@db:5432/netinv
    volumes: ["./config.toml:/app/config.toml:ro"]

volumes:
  pgdata:
